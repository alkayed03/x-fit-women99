<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e0457b">
<title>Xfit Gym · الإدارة</title>
<style>
:root{--pink:#e0457b;--pink-l:#fde8f0;--bg:#fff8fb;--card:#fff;--text:#2b2b33;--mute:#8b8b99;--line:#f1d9e3;--ok:#1a9d4a;--bad:#d33}
@media (prefers-color-scheme:dark){:root{--bg:#17131a;--card:#221b27;--text:#f4eef6;--mute:#a79fb0;--line:#3a2c42;--pink-l:#3a2030}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{color:var(--pink);font-size:22px;margin:6px 0 14px;display:flex;justify-content:space-between;align-items:center}
h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--text)}
textarea{min-height:110px;resize:vertical;line-height:1.7}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
button{font:inherit;font-weight:700;border:none;border-radius:12px;padding:11px 14px;cursor:pointer;background:var(--pink);color:#fff}
button:disabled{opacity:.5}
button.ghost{background:transparent;color:var(--pink);border:1px solid var(--pink)}
.full{width:100%;margin-top:12px}
.msg{font-size:14px;margin:8px 0 0;min-height:1.2em}.err{color:var(--bad)}.ok{color:var(--ok)}
.mute{color:var(--mute);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.chip{background:transparent;color:var(--pink);border:1px solid var(--pink);padding:6px 12px;font-size:13px;border-radius:20px}
.chip[aria-pressed="true"]{background:var(--pink);color:#fff}
.row{display:block;width:100%;text-align:start;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-weight:400}
.row:hover{border-color:var(--pink)}
.row b{display:block;font-size:16px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center;font-size:13px;color:var(--mute)}
.tag{background:var(--pink-l);color:var(--pink);border-radius:20px;padding:2px 10px;font-weight:700;font-size:12px}
.tag.x{background:transparent;border:1px solid var(--line);color:var(--mute)}
.tag.bad{color:var(--bad);border:1px solid var(--bad);background:transparent}
.count{font-size:13px;color:var(--mute);margin:8px 2px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--text);width:min(520px,94vw);max-height:92vh;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.acts{display:flex;gap:8px;margin-top:14px}.acts button{flex:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1><span>إدارة المشتركات</span><button id="out" class="ghost" type="button" hidden>خروج</button></h1>

  <section id="auth" class="card" hidden>
    <label for="em">إيميل الأدمن</label><input id="em" type="email" dir="ltr" autocomplete="email">
    <label for="pw">كلمة السر</label><input id="pw" type="password" dir="ltr" autocomplete="current-password">
    <p id="amsg" class="msg"></p>
    <button id="go" class="full" type="button">دخول</button>
  </section>

  <section id="app" hidden>
    <div class="card">
      <label for="q" style="margin-top:0">بحث بالاسم أو الرقم أو الإيميل</label>
      <input id="q" type="search" autocomplete="off">
      <div class="chips" id="chips">
        <button class="chip" type="button" data-f="all" aria-pressed="true">الكل</button>
        <button class="chip" type="button" data-f="private" aria-pressed="false">برايفت</button>
        <button class="chip" type="button" data-f="sched" aria-pressed="false">عندها جدول</button>
        <button class="chip" type="button" data-f="nut" aria-pressed="false">عندها تغذية</button>
        <button class="chip" type="button" data-f="expired" aria-pressed="false">منتهي</button>
        <button class="chip" type="button" data-f="none" aria-pressed="false">بدون اشتراك</button>
      </div>
      <p id="count" class="count"></p>
    </div>
    <div id="list"></div>
  </section>
</div>

<dialog id="dlg">
  <h2 id="dName"></h2>
  <p id="dInfo" class="mute" dir="auto"></p>
  <label for="fType">نوع الاشتراك</label>
  <select id="fType"><option value="group">جروب</option><option value="private">برايفت 💎</option></select>
  <label for="fEnd">تاريخ الانتهاء</label>
  <input id="fEnd" type="date" dir="ltr">
  <label for="fSched">الجدول الخاص (برايفت)</label>
  <textarea id="fSched"></textarea>
  <label for="fNut">خطة التغذية (برايفت)</label>
  <textarea id="fNut"></textarea>
  <label for="fNote">ملاحظات من الكوتش</label>
  <textarea id="fNote"></textarea>
  <p id="dmsg" class="msg"></p>
  <div class="acts"><button id="dSave" type="button">حفظ</button><button id="dClose" class="ghost" type="button">إغلاق</button></div>
</dialog>

<script type="module">
import { auth, db, onAuthStateChanged, signInWithEmailAndPassword, signOut,
  doc, setDoc, collection, getDocs, serverTimestamp } from "./xfit-firebase.js";
const $ = s => document.querySelector(s);
const say = (n, t, k) => { n.textContent = t || ""; n.className = "msg " + (k || ""); };
const ERR = {
  "auth/invalid-credential": "الإيميل أو كلمة السر غلط",
  "auth/wrong-password": "الإيميل أو كلمة السر غلط",
  "auth/user-not-found": "الإيميل أو كلمة السر غلط",
  "auth/invalid-email": "الإيميل غير صحيح",
  "auth/too-many-requests": "محاولات كثيرة، جرّبي بعد شوي",
  "auth/network-request-failed": "ما في اتصال، جرّبي مرة ثانية"
};
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

let members = [], filter = "all", current = null;

$("#go").onclick = async () => {
  const m = $("#amsg"), email = $("#em").value.trim(), pw = $("#pw").value;
  if (!email || !pw) return say(m, "اكتبي الإيميل وكلمة السر", "err");
  $("#go").disabled = true; say(m, "...");
  try { await signInWithEmailAndPassword(auth, email, pw); }
  catch (e) { say(m, ERR[e.code] || "صار خطأ، جرّبي مرة ثانية", "err"); }
  finally { $("#go").disabled = false; }
};
$("#out").onclick = () => signOut(auth);

async function load() {
  const list = $("#list");
  list.replaceChildren(); $("#count").textContent = "جاري التحميل...";
  try {
    const [us, ms] = await Promise.all([getDocs(collection(db, "users")), getDocs(collection(db, "memberships"))]);
    const mm = {}; ms.forEach(d => mm[d.id] = d.data());
    members = us.docs.map(d => ({ uid: d.id, u: d.data(), m: mm[d.id] || null }))
      .sort((a, b) => String(a.u.name || "").localeCompare(String(b.u.name || ""), "ar"));
    render();
  } catch (e) {
    $("#count").textContent = "";
    const p = document.createElement("p"); p.className = "msg err";
    p.textContent = "ما قدرت أحمّل البيانات. تأكدي إنك داخلة بإيميل الأدمن وإنه قواعد Firestore منشورة.";
    list.appendChild(p);
  }
}

function tag(text, cls) { const s = document.createElement("span"); s.className = "tag " + (cls || ""); s.textContent = text; return s; }

function render() {
  const q = $("#q").value.trim().toLowerCase(), t = today();
  const rows = members.filter(x => {
    const m = x.m, expired = m && m.end && m.end < t;
    if (filter === "private" && !(m && m.type === "private")) return false;
    if (filter === "sched" && !(m && m.schedule)) return false;
    if (filter === "nut" && !(m && m.nutrition)) return false;
    if (filter === "expired" && !expired) return false;
    if (filter === "none" && m) return false;
    if (!q) return true;
    return [x.u.name, x.u.phone, x.u.email].some(v => String(v || "").toLowerCase().includes(q));
  });
  $("#count").textContent = rows.length + " من " + members.length + " مشتركة";
  const list = $("#list"); list.replaceChildren();
  if (!rows.length) { const p = document.createElement("p"); p.className = "mute"; p.textContent = "ما في نتائج. جرّبي بحث أو فلتر ثاني."; list.appendChild(p); return; }
  rows.forEach(x => {
    const b = document.createElement("button"); b.type = "button"; b.className = "row";
    const n = document.createElement("b"); n.textContent = x.u.name || "(بدون اسم)";
    const meta = document.createElement("div"); meta.className = "meta";
    const ph = document.createElement("span"); ph.dir = "ltr"; ph.textContent = x.u.phone || "";
    meta.appendChild(ph);
    const m = x.m;
    if (!m) meta.appendChild(tag("بدون اشتراك", "x"));
    else {
      meta.appendChild(tag(m.type === "private" ? "برايفت 💎" : "جروب"));
      if (m.end) meta.appendChild(m.end < t ? tag("انتهى " + m.end, "bad") : tag("حتى " + m.end, "x"));
      if (m.schedule) meta.appendChild(tag("جدول", "x"));
      if (m.nutrition) meta.appendChild(tag("تغذية", "x"));
    }
    b.append(n, meta); b.onclick = () => openEditor(x); list.appendChild(b);
  });
}

function openEditor(x) {
  current = x; const m = x.m || {};
  $("#dName").textContent = x.u.name || "(بدون اسم)";
  $("#dInfo").textContent = [x.u.phone, x.u.email].filter(Boolean).join(" · ");
  $("#fType").value = m.type === "private" ? "private" : "group";
  $("#fEnd").value = m.end || "";
  $("#fSched").value = m.schedule || "";
  $("#fNut").value = m.nutrition || "";
  $("#fNote").value = m.note || "";
  say($("#dmsg")); $("#dlg").showModal();
}
$("#dClose").onclick = () => $("#dlg").close();
$("#dSave").onclick = async () => {
  const m = $("#dmsg"); if (!current) return;
  const data = {
    type: $("#fType").value, end: $("#fEnd").value,
    schedule: $("#fSched").value.trim(), nutrition: $("#fNut").value.trim(), note: $("#fNote").value.trim(),
    updatedAt: serverTimestamp()
  };
  $("#dSave").disabled = true; say(m, "...");
  try {
    await setDoc(doc(db, "memberships", current.uid), data, { merge: true });
    current.m = { ...(current.m || {}), ...data };
    say(m, "✅ انحفظ", "ok"); render();
    setTimeout(() => $("#dlg").close(), 600);
  } catch (e) { say(m, "ما انحفظ. تأكدي من القواعد وجرّبي مرة ثانية", "err"); }
  finally { $("#dSave").disabled = false; }
};

$("#q").oninput = render;
$("#chips").onclick = e => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#chips .chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  render();
};

onAuthStateChanged(auth, u => {
  $("#auth").hidden = !!u; $("#app").hidden = !u; $("#out").hidden = !u;
  if (u) load();
});
</script>
</body>
</html>
